[package]
name = "e2e-ptt"
version = "0.1.0"
edition = "2021"
description = "E2E test for PTT Floor Control (MBCP over RTCP APP)"
authors = ["Tae Goo Kang <kodeholic99@gmail.com>"]

[[bin]]
name = "e2e-ptt"
path = "src/main.rs"

[dependencies]
# workspace common
oxlens-lab-common = { path = "../common" }

# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
