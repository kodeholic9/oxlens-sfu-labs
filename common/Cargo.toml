[package]
name = "oxlens-lab-common"
version = "0.1.0"
edition = "2021"
description = "Shared client library for oxlens-sfu-labs (signaling, STUN, DTLS, SRTP, MBCP)"
authors = ["Tae Goo Kang <kodeholic99@gmail.com>"]

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
bytes = "1"

# WebSocket client (signaling)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# DTLS + SRTP
dtls        = "0.17.1"
webrtc-srtp = "0.17.1"
webrtc-util = "0.17.1"

# STUN MESSAGE-INTEGRITY
hmac = "0.12"
sha1 = "0.10"
crc32fast = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging
tracing = "0.1"

# async
async-trait = "0.1"

# random
getrandom = { version = "0.3", features = ["std"] }
