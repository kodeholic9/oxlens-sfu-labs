[package]
name = "oxlab-cli"
version = "0.1.0"
edition = "2021"
description = "OxLabs CLI — unified test runner"
authors = ["Tae Goo Kang <kodeholic99@gmail.com>"]

[[bin]]
name = "oxlab"
path = "src/main.rs"

[dependencies]
oxlab-bot = { path = "../oxlab-bot" }
oxlab-net = { path = "../oxlab-net" }
oxlab-scenario = { path = "../oxlab-scenario" }
oxlab-judge = { path = "../oxlab-judge" }
oxlens-lab-common = { path = "../../common" }

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# capacity 자원 측정 — 봇(self) + sfud 프로세스 CPU/mem (§8 병목 분리)
sysinfo = "0.32"
# 분산 worker report (JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
